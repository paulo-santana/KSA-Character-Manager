# A merge to master that brings a new version in mod.toml publishes it: tag v<version>, one zip, uploaded to
# the GitHub release and, once the mod has a SpaceDock page, to SpaceDock. A merge that keeps the version
# (workflows, ...) publishes nothing. check.yml makes sure a pull request that changes shipped files bumps
# the version and has release-notes/v<version>.md.
#
# Needs, in the repository settings:
#   secret BUILD_LIBS_KEY (see check.yml)
#   for SpaceDock: variable SPACEDOCK_MOD_ID, variable SPACEDOCK_USERNAME, secret SPACEDOCK_PASSWORD;
#   optional variable SPACEDOCK_GAME_VERSION (default: SpaceDock's newest KSA version)

name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release

env:
  SPACEDOCK_GAME_ID: "22409"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is there a new version?
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' mod/CharacterManager/mod.toml)"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} is already released; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "release-notes/${tag}.md" \
            || { echo "release-notes/${tag}.md is missing or empty"; exit 1; }
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "ZIP=CharacterManager-${tag}.zip" >> "$GITHUB_ENV"

      - name: Check the mod
        if: steps.version.outputs.new == 'true'
        run: python3 .github/scripts/check_mod.py

      - uses: actions/checkout@v4
        if: steps.version.outputs.new == 'true'
        with:
          repository: paulo-santana/ksa-build-libs
          ssh-key: ${{ secrets.BUILD_LIBS_KEY }}
          path: build-libs

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.new == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Build the zip
        if: steps.version.outputs.new == 'true'
        run: |
          bash .github/scripts/build.sh build-libs "$ZIP"
          { cat "release-notes/${TAG}.md"; echo; echo "Built against KSA $(cat build-libs/GAME_VERSION) and StarMap $(cat build-libs/STARMAP_VERSION)."; } > notes.md

      - name: GitHub release (creates the tag)
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
            --title "Character Manager ${VERSION}" \
            --notes-file notes.md

      - name: SpaceDock upload
        if: steps.version.outputs.new == 'true' && vars.SPACEDOCK_MOD_ID != ''
        env:
          SD_MOD_ID: ${{ vars.SPACEDOCK_MOD_ID }}
          SD_USER: ${{ vars.SPACEDOCK_USERNAME }}
          SD_PASS: ${{ secrets.SPACEDOCK_PASSWORD }}
          SD_GAME_VERSION: ${{ vars.SPACEDOCK_GAME_VERSION }}
        run: |
          game_version="${SD_GAME_VERSION:-$(curl -sf "https://spacedock.info/api/${SPACEDOCK_GAME_ID}/versions" | jq -r '.[0].friendly_version')}"
          echo "SpaceDock game version: ${game_version}"
          curl -s -c cookies --form-string "username=${SD_USER}" --form-string "password=${SD_PASS}" \
            https://spacedock.info/api/login > login.json
          if [ "$(jq -r .error login.json)" = "true" ]; then
            echo "SpaceDock login failed: $(jq -r .reason login.json)"; exit 1
          fi
          curl -s -b cookies \
            --form-string "version=${VERSION}" \
            -F "changelog=<notes.md" \
            --form-string "game-version=${game_version}" \
            --form-string "notify-followers=yes" \
            -F "zipball=@${ZIP}" \
            "https://spacedock.info/api/mod/${SD_MOD_ID}/update" > update.json
          cat update.json; echo
          if [ "$(jq -r .error update.json)" = "true" ]; then
            echo "SpaceDock upload failed: $(jq -r .reason update.json)"; exit 1
          fi
